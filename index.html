<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Capsule Builder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B7A6A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Capsule">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column on phones; builder left + outfit bank right on wide screens. Same tokens as the Trip Outfit Planner. */
:root{
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#F4F6F7;
  --ink:#13202A; --ink-2:#51616D; --line:#D3DADF; --line-strong:#B3BFC8;
  --accent:#0B7A6A; --accent-hover:#096658; --on-accent:#FFFFFF; --accent-soft:#D8EEE9;
  --danger:#B3261E;
  --c-outer:#3C5BA3; --c-top:#9A6410; --c-bottom:#3A7440;
  /* Product photos always sit on a light stone card, in both themes */
  --photo-bg:#F0EFED; --photo-line:#DDDBD7; --photo-ink:#4A545C;
  --w:clamp(116px,34vw,150px);       /* centre carousel card width */
  --h:calc(var(--w)*1.25);
  --slim:clamp(124px,33vw,172px);    /* outfit bank: card without outerwear */
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E161C; --surface:#151F27; --surface-2:#1A2630;
    --ink:#E7EEF2; --ink-2:#9FB1BD; --line:#283640; --line-strong:#3A4C58;
    --accent:#3FC4AE; --accent-hover:#63D3C0; --on-accent:#05221D; --accent-soft:#143B35;
    --danger:#F2877F;
    --c-outer:#8FA8E6; --c-top:#E0AE5C; --c-bottom:#86C98B;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-block:16px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
.wrap{max-width:1160px;margin:0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:8px 20px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{min-height:40px;padding:8px 14px;font-size:.875rem}
.panel{margin-bottom:20px;padding:12px 16px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
.panel .lab{display:block;font:600 .9rem/1.3 var(--font-display)}
.panel .sub{margin-top:2px;font-size:.8125rem;color:var(--ink-2)}
.panel textarea{display:block;width:100%;margin-block:8px;padding:10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);color:var(--ink);font:.8125rem/1.5 var(--font-mono)}
.panel .oacts{display:flex;flex-wrap:wrap;gap:8px}
.panel .btn{min-height:40px;padding:8px 14px;font-size:.875rem}
.panel .btn.primary{width:auto;max-width:none}
.btn.warn{background:var(--danger);border-color:var(--danger);color:#fff}
h1{font:600 clamp(1.6rem,4.5vw,2.1rem)/1.1 var(--font-display);letter-spacing:-0.02em;text-wrap:balance}
.meta{margin-top:6px;font:500 .72rem/1.4 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

.layout{display:grid;gap:40px}
@media (min-width:1040px){
  .layout{grid-template-columns:400px minmax(0,1fr);gap:56px;align-items:start}
  :root{--slim:172px;--w:150px}
}
@media (min-width:1040px) and (min-height:1000px){ .builder{position:sticky;top:16px} }

h2{font:600 1.35rem/1.2 var(--font-display);letter-spacing:-0.01em;text-align:center}
.lede{margin-top:4px;text-align:center;font-size:.8125rem;color:var(--ink-2)}

/* ---------- Builder ---------- */
.cat{margin-top:22px}
.cat h3{display:flex;align-items:center;justify-content:center;gap:8px;font:600 1rem/1.2 var(--font-display);margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cat[data-cat="outer"]{--c:var(--c-outer)} .cat[data-cat="top"]{--c:var(--c-top)} .cat[data-cat="bottom"]{--c:var(--c-bottom)}
.opt{font:500 .68rem/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

.photo{background:var(--photo-bg);border:1px solid var(--photo-line);border-radius:26px}
.photo img{display:block;width:78%;height:82%;min-width:0;min-height:0;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}

/* Outerwear: one toggle card */
.outrow{display:flex;justify-content:center;gap:14px}
.outer{grid-template:minmax(0,1fr) / minmax(0,1fr);position:relative;display:grid;place-items:center;width:var(--w);height:var(--h);margin:0;padding:0;cursor:pointer;
  color:inherit;font:inherit;transition:box-shadow .2s,border-color .2s}
.outer img{opacity:.45;filter:grayscale(.35);transition:opacity .2s,filter .2s}
.outer:hover img{opacity:.7}
.outer[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 8px 20px rgba(19,32,42,.14)}
.outer[aria-pressed="true"] img{opacity:1;filter:none}
.tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;transform:scale(0);transition:transform .2s}
.outer[aria-pressed="true"] .tick{transform:scale(1)}
.cap{margin-top:8px;text-align:center;font-size:.8125rem;color:var(--ink-2);min-height:1.5em}

/* Carousel */
.stage{position:relative;height:calc(var(--h) + 48px);overflow:hidden;touch-action:pan-y;outline-offset:-2px;border-radius:12px}
.stage[data-car="bottom"]{--h:calc(var(--w)*1.875)}
.stage[data-car="bottom"] .slide img{height:88%}
.slide{grid-template:minmax(0,1fr) / minmax(0,1fr);position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);display:grid;place-items:center;cursor:pointer;
  transform:translate(-50%,-50%) translateX(var(--tx,0px)) scale(var(--s,1));
  transition:transform .38s cubic-bezier(.3,.7,.2,1),opacity .3s,box-shadow .3s}
.slide[data-pos="0"]{--tx:0px;--s:1;z-index:3;cursor:default;box-shadow:0 8px 22px rgba(19,32,42,.16)}
.slide[data-pos="-1"]{--tx:calc(var(--w)*-.79 - 14px);--s:.58;z-index:2}
.slide[data-pos="1"] {--tx:calc(var(--w)*.79 + 14px);--s:.58;z-index:2}
.slide[data-pos="-2"]{--tx:calc(var(--w)*-1.25 - 30px);--s:.4;opacity:0;pointer-events:none;z-index:1}
.slide[data-pos="2"] {--tx:calc(var(--w)*1.25 + 30px);--s:.4;opacity:0;pointer-events:none;z-index:1}
.slide.nojump{transition:none!important;opacity:0!important}
.stage.init .slide{transition:none}

.ctl{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.nm{min-width:170px;text-align:center;font-size:.875rem;font-weight:600;line-height:1.25}
.ix{display:block;font:500 .68rem/1.4 var(--font-mono);letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase}
.round{width:36px;height:36px;padding:0;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;
  display:grid;place-items:center}
.round:hover{background:var(--surface-2)}

.make{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);text-align:center}
.btn{min-height:46px;padding:10px 18px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);
  font:600 .95rem/1.2 var(--font-body);cursor:pointer}
.btn.primary{width:100%;max-width:340px;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover)}
.btn.primary:disabled{background:var(--line);border-color:var(--line-strong);color:var(--ink-2);cursor:not-allowed}
.exists{margin-top:8px;min-height:1.5em;font-size:.8125rem;color:var(--ink-2)}
.linkbtn{padding:0;border:0;background:none;color:var(--accent);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.tabs button{padding:12px 18px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--ink-2);font:600 .9375rem/1.2 var(--font-body);cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- Calendar ---------- */
.cal{--slim:clamp(84px,25vw,150px);max-width:760px;margin:0 auto}
@media (min-width:900px){.cal{--slim:180px;max-width:900px}}
@media (min-width:1280px){.cal{--slim:205px;max-width:1000px}}
.cstage{position:relative;height:calc(var(--slim)*2.05 + 40px);margin-top:18px;overflow:hidden;touch-action:pan-y;border-radius:12px;outline-offset:-2px}
.cslot{position:absolute;left:50%;top:50%;width:calc(var(--slim)*1.4);height:calc(var(--slim)*2.05);display:grid;place-items:center;cursor:pointer;
  transform:translate(-50%,-50%) translateX(var(--tx,0px)) scale(var(--s,1));transition:transform .38s cubic-bezier(.3,.7,.2,1),opacity .3s}
.cslot[data-pos="0"]{--tx:0px;--s:1;z-index:3;cursor:default}
.cslot[data-pos="-1"]{--tx:calc(var(--slim)*-1.26 - 6px);--s:.74;z-index:2}
.cslot[data-pos="1"] {--tx:calc(var(--slim)*1.26 + 6px);--s:.74;z-index:2}
.cslot[data-pos="-2"]{--tx:calc(var(--slim)*-2.1 - 20px);--s:.5;opacity:0;pointer-events:none;z-index:1}
.cslot[data-pos="2"] {--tx:calc(var(--slim)*2.1 + 20px);--s:.5;opacity:0;pointer-events:none;z-index:1}
.cslot[data-pos="0"] .art{box-shadow:0 10px 26px rgba(19,32,42,.18)}
.cstage.init .cslot{transition:none}
.cal .art{padding:12px}
.art.noout{display:grid;place-items:center;border-style:dashed;border-color:var(--line-strong);background:transparent;color:var(--ink-2);text-align:center;font-size:.8125rem;grid-template-rows:1fr;grid-template-columns:1fr}
.art.noout b{display:block;font:600 1.6rem/1 var(--font-display);margin-bottom:4px}
.cctl{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.dayinfo{flex:none;width:min(380px,calc(100vw - 32px - 92px));text-align:center}
.dayinfo .dn{font:600 1.05rem/1.3 var(--font-display)}
.dayinfo .dd{font-size:.9rem;color:var(--ink-2)}
.dayinfo .dnote{margin-top:2px;font-size:.9rem;line-height:1.4;min-height:2.8em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
@media (max-width:340px){.dayinfo .dnote{font-size:.8rem}}
.dayinfo .dleaf{font-size:1.1rem;line-height:1.4;min-height:1.4em;letter-spacing:2px}
.daystrip{display:flex;gap:6px;margin-top:16px;padding:4px 2px 8px;overflow-x:auto;scrollbar-width:thin}
.chip:first-child{margin-left:auto}.chip:last-child{margin-right:auto}   /* centres the row, but still scrolls from Day 1 when it overflows */
.chip{flex:none;min-width:44px;padding:6px 4px 5px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:center;font:600 .875rem/1.15 var(--font-body)}
.chip small{display:block;font:500 .62rem/1.2 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.chip i{display:block;width:6px;height:6px;margin:3px auto 0;border-radius:50%;background:transparent;border:1px solid var(--line-strong)}
.chip.has i{background:var(--accent);border-color:var(--accent)}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-current="true"] small{color:var(--on-accent)}
.chip[aria-current="true"] i{border-color:var(--on-accent)} .chip[aria-current="true"].has i{background:var(--on-accent)}
.picker{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.pickhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.pickhead h3{font:600 1rem/1.3 var(--font-display)}
.pickhead .acts{display:flex;gap:8px}
.mbtn{min-height:34px;padding:4px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink-2);font:600 .8125rem/1.2 var(--font-body);cursor:pointer}
.mbtn:hover:not(:disabled){background:var(--surface-2)}
.mbtn:disabled{opacity:.4;cursor:not-allowed}
.mbtn[aria-pressed="true"]{background:#B7791F;border-color:#B7791F;color:#fff}
.pickstrip{--slim:66px;display:flex;gap:10px;margin-top:12px;padding:6px 4px 10px;overflow-x:auto;align-items:flex-start;scrollbar-width:thin}
.pick{position:relative;flex:none;padding:0;border:0;background:none;cursor:pointer;color:inherit;font:inherit;border-radius:18px;text-align:center}
.pick .art{padding:6px;gap:4px;border-radius:16px}
.pick[aria-pressed="true"] .art{box-shadow:0 0 0 2px var(--accent)}
.pick .tick{top:6px;right:6px;width:22px;height:22px;transform:scale(0)}
.pick[aria-pressed="true"] .tick{transform:scale(1)}
.pick .used{display:block;margin-top:4px;font:500 .62rem/1.2 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);min-height:1.2em}
.pick .pstar{position:absolute;left:8px;bottom:22px;color:#C98A12;line-height:0}
.pickempty{margin-top:12px;padding:18px;border:1px dashed var(--line-strong);border-radius:12px;text-align:center;color:var(--ink-2);font-size:.875rem}

/* ---------- Outfit bank ---------- */
.ctls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.fav-filter{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 14px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink-2);font:600 .8125rem/1.2 var(--font-body);cursor:pointer}
.fav-filter:hover{background:var(--surface-2)}
.fav-filter[aria-pressed="true"]{background:#B7791F;border-color:#B7791F;color:#fff}
.star{position:absolute;bottom:7px;right:9px;width:28px;height:28px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--photo-ink);cursor:pointer;display:grid;place-items:center}
.star::after{content:"";position:absolute;inset:-6px}
.star:hover{background:rgba(0,0,0,.07)}
.star svg{fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s}
.star[aria-pressed="true"]{color:#C98A12}
.star[aria-pressed="true"] svg{fill:currentColor}
.star:active svg{transform:scale(.85)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);overflow:hidden}
.seg button{min-height:36px;padding:6px clamp(8px,2.4vw,14px);white-space:nowrap;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink-2);font:600 .8125rem/1.2 var(--font-body);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.grp{margin-top:26px}
.grp:first-child{margin-top:22px}
.gh{display:flex;align-items:center;justify-content:center;gap:10px;font:600 1rem/1.2 var(--font-display);padding-bottom:10px;border-bottom:1px solid var(--line)}
.gh .gt{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;flex:none}
.gh .gt img{width:80%;height:80%;object-fit:contain}
.gh .gc{font:500 .72rem/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.grp .bank{margin-top:16px}
@media (min-width:1040px){ .gh{justify-content:flex-start} }
.bankhead{display:flex;flex-direction:column;align-items:center}
.count{margin-top:6px;font:500 .72rem/1.4 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.bank{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:18px 14px;align-items:flex-start}
@media (min-width:1040px){ .bank{justify-content:flex-start} h2.bt,.bankhead{align-items:flex-start;text-align:left} .bankhead .lede{text-align:left} }
.ocard{position:relative;width:var(--slim);flex:none}
.ocard.wide{width:calc(var(--slim)*1.4)}
.art{position:relative;height:calc(var(--slim)*2.05);padding:12px 12px 38px;display:grid;gap:8px;border-radius:28px;
  grid-template-rows:minmax(0,38fr) minmax(0,62fr);grid-template-columns:minmax(0,1fr)}
.ocard.wide .art{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.art img{width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}
.art .i-outer{grid-row:1 / 3;grid-column:1}
.ocard.wide .art .i-top{grid-column:2;grid-row:1} .ocard.wide .art .i-bottom{grid-column:2;grid-row:2}
.num{position:absolute;top:11px;left:16px;font:500 .7rem/1 var(--font-mono);color:var(--photo-ink)}
.rm{position:absolute;top:6px;right:8px;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--photo-ink);
  cursor:pointer;display:grid;place-items:center;opacity:.7}
.rm::after{content:"";position:absolute;inset:-8px}
.rm:hover{opacity:1;background:rgba(0,0,0,.07);color:var(--danger)}
.bar{display:flex;justify-content:center;gap:4px;margin-top:8px}
.bar button{width:36px;height:34px;padding:0;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.bar button:hover:not(:disabled){background:var(--surface-2)}
.bar button:disabled{opacity:.35;cursor:not-allowed}
.bar [data-grip]{cursor:grab;touch-action:none}
.ocard.is-dragging{opacity:.3}
.drag-clone{position:fixed;z-index:60;margin:0;pointer-events:none;transform:rotate(1.5deg) scale(1.03);filter:drop-shadow(0 14px 22px rgba(0,0,0,.28))}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
@keyframes fresh{0%{box-shadow:0 0 0 0 var(--accent)}30%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.ocard.fresh .art{animation:fresh 1.6s ease-out}

.empty{margin-top:22px;padding:28px 20px;border:1px dashed var(--line-strong);border-radius:14px;text-align:center;color:var(--ink-2)}

footer{margin-top:40px;font-size:.8125rem;color:var(--ink-2);text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;transform:translate(-50%,24px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);
  font-size:.875rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .25s,opacity .25s}
#toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#toast button{padding:4px 2px;border:0;background:none;color:var(--accent-soft);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
@media (prefers-color-scheme:dark){#toast button{color:var(--accent-hover)}}
@media (prefers-reduced-motion:reduce){
  .cslot{transition:none}
  .slide,.outer,.tick,.outer img,#toast{transition:none}
  .ocard.fresh .art{animation:none;box-shadow:0 0 0 3px var(--accent)}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
    <h1>Capsule wardrobe</h1>
    <p class="meta">Japan 2026</p>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="copyAll">Copy all</button>
      <button type="button" class="btn" id="pasteOpen">Paste all</button>
    </div>
  </header>
  <div class="panel" id="fallback" hidden>
    <label class="lab" for="fbta">Text to copy</label>
    <textarea id="fbta" rows="5" readonly></textarea>
    <button type="button" class="btn" id="fbClose">Close</button>
  </div>
  <div class="panel" id="pastebox" hidden>
    <label class="lab" for="pta">Paste all</label>
    <p class="sub">Paste the text from Copy all. It replaces every outfit, favourite and calendar day on this device.</p>

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));

/* older saves used true for the one coat */
const cleanOuter=v=>v===true?'coat':(typeof v==='string'&&find('outer',v)?v:null);
const announce=t=>{const s=$('#sr');s.textContent='';setTimeout(()=>{s.textContent=t;},30);};

/* ---------- state ---------- */
const KEY='capsule-builder-v1';
function seed(){
  const mk=(outer,top,bottom)=>({id:uid(),outer,top,bottom});
  return {outfits:[mk('coat','top-cream','bot-plaid'),mk(null,'top-taupe','bot-plaid')]};
}
const MIG={'top-oatmeal':'top-taupe','bot-skirt':'bot-plaid'};
/* Keep only outfits made of known items, one per combination. */
function cleanOutfits(arr){
  const seen=new Set();
  return arr.filter(o=>o&&typeof o==='object')
    .map(o=>({id:String(o.id||uid()),outer:cleanOuter(o.outer),top:MIG[o.top]||o.top,bottom:MIG[o.bottom]||o.bottom,fav:!!o.fav}))
    .filter(o=>find('top',o.top)&&find('bottom',o.bottom))
    .filter(o=>{const k=sig(o);if(seen.has(k))return false;seen.add(k);return true;})
    .filter((o,k,a)=>a.findIndex(x=>x.id===o.id)===k);
}
function load(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY));
    if(r&&Array.isArray(r.outfits))return {outfits:cleanOutfits(r.outfits)};
  }catch(e){}
  return seed();
}
let S=load();
let view=(()=>{try{const v=JSON.parse(localStorage.getItem(KEY)).view;return v==='top'||v==='bottom'?v:'custom';}catch(e){return 'custom';}})();
let favOnly=(()=>{try{return JSON.parse(localStorage.getItem(KEY)).favOnly===true;}catch(e){return false;}})();
let P=(()=>{try{const r=JSON.parse(localStorage.getItem(KEY));const ids=new Set(S.outfits.map(o=>o.id)),out={};
  if(r&&r.plan)Object.keys(r.plan).forEach(k=>{if(ids.has(r.plan[k])&&DAYS.some(d=>d.date===k))out[k]=r.plan[k];});return out;}catch(e){return {};}})();
const vis=()=>favOnly?S.outfits.filter(o=>o.fav):S.outfits;
function persist(){try{localStorage.setItem(KEY,JSON.stringify({outfits:S.outfits,view,favOnly,plan:P}));}catch(e){}}
const sel={outer:null,top:Math.min(1,ITEMS.top.length-1),bottom:Math.min(1,ITEMS.bottom.length-1)};
const current=()=>({outer:sel.outer,top:ITEMS.top[sel.top].id,bottom:ITEMS.bottom[sel.bottom].id});
const existing=()=>S.outfits.find(o=>sig(o)===sig(current()));

/* ---------- builder ---------- */
const CHEV={l:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
            r:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'};
const CHECK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';
const imgTag=(it,cls)=>'<img'+(cls?' class="'+cls+'"':'')+' src="'+IMG[it.img]+'" alt="'+esc(it.name)+'" draggable="false">';

function buildBuilder(){
  let h='<section class="cat" data-cat="outer" aria-labelledby="h-outer"><h3 id="h-outer"><span class="dot"></span>Outerwear <span class="opt">optional</span></h3>'
    +'<div class="outrow" role="group" aria-label="Outerwear. Choose one, or none.">'
    +ITEMS.outer.map(o=>'<button type="button" class="outer photo" data-id="'+o.id+'" aria-pressed="false" aria-label="'+esc(o.name)+'">'+imgTag(o)+'<span class="tick">'+CHECK+'</span></button>').join('')
    +'</div><p class="cap" id="outerCap"></p></section>';
  [['top','Tops'],['bottom','Bottoms']].forEach(([cat,label])=>{
    h+='<section class="cat" data-cat="'+cat+'" aria-labelledby="h-'+cat+'"><h3 id="h-'+cat+'"><span class="dot"></span>'+label+'</h3>'
      +'<div class="stage init" tabindex="0" role="group" aria-roledescription="carousel" aria-label="'+label+'. Left and right arrow keys change the selection." data-car="'+cat+'">'
      +ITEMS[cat].map((it,i)=>'<div class="slide photo" data-i="'+i+'" data-pos="2">'+imgTag(it)+'</div>').join('')
      +'</div><div class="ctl"><button type="button" class="round" data-dir="-1">'+CHEV.l+'</button>'
      +'<p class="nm"><span class="n"></span></p>'
      +'<button type="button" class="round" data-dir="1">'+CHEV.r+'</button></div></section>';
  });
  $('#builder').innerHTML=h;
  ['top','bottom'].forEach(cat=>{
    setCar(cat,sel[cat],false);
    requestAnimationFrame(()=>requestAnimationFrame(()=>$('.stage[data-car="'+cat+'"]').classList.remove('init')));
  });
  setOuter(null);
}

function setOuter(id){
  sel.outer=id||null;
  $$('.outer').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===sel.outer?'true':'false'));
  $('#outerCap').textContent=sel.outer?find('outer',sel.outer).name+' · tap again to remove':'No outerwear · tap a coat to add it';
}

function circ(i,cur,n){const h=Math.floor(n/2);return ((i-cur+n+h)%n)-h;}
function setCar(cat,cur,animate){
  const n=ITEMS[cat].length;
  sel[cat]=((cur%n)+n)%n;
  const stage=$('.stage[data-car="'+cat+'"]');
  Array.from(stage.children).forEach((el,i)=>{
    const pos=Math.max(-2,Math.min(2,circ(i,sel[cat],n)));
    const prev=Number(el.dataset.pos);
    if(animate&&Math.abs(pos-prev)>1&&!reduced()){
      el.classList.add('nojump');el.dataset.pos=pos;void el.offsetWidth;el.classList.remove('nojump');
    }else el.dataset.pos=pos;
    const hidden=Math.abs(pos)>1;
    if(hidden)el.setAttribute('aria-hidden','true');else el.removeAttribute('aria-hidden');
    el.dataset.side=pos;
  });
  const it=ITEMS[cat][sel[cat]];
  const sec=stage.closest('.cat');
  sec.querySelector('.n').textContent=it.name;
  const prevIt=ITEMS[cat][(sel[cat]-1+n)%n],nextIt=ITEMS[cat][(sel[cat]+1)%n];
  const bs=sec.querySelectorAll('.round');
  bs[0].setAttribute('aria-label','Previous '+LABEL[cat]+': '+prevIt.name);
  bs[1].setAttribute('aria-label','Next '+LABEL[cat]+': '+nextIt.name);
  bs[0].disabled=bs[1].disabled=n<2;
  if(animate)announce(LABEL[cat]+': '+it.name);
  updateCreate();
}

let swiped=false;
function wireBuilder(){
  $$('.outer').forEach(b=>b.addEventListener('click',()=>{setOuter(sel.outer===b.dataset.id?null:b.dataset.id);updateCreate();}));
  $$('.stage').forEach(stage=>{
    const cat=stage.dataset.car;
    stage.addEventListener('keydown',e=>{
      if(e.key==='ArrowLeft'){e.preventDefault();setCar(cat,sel[cat]-1,true);}
      else if(e.key==='ArrowRight'){e.preventDefault();setCar(cat,sel[cat]+1,true);}
    });
    stage.addEventListener('click',e=>{
      if(swiped){swiped=false;return;}
      const s=e.target.closest('.slide');if(!s)return;
      const p=Number(s.dataset.pos);
      if(p===-1)setCar(cat,sel[cat]-1,true);else if(p===1)setCar(cat,sel[cat]+1,true);
    });
    let x0=null;
    stage.addEventListener('pointerdown',e=>{x0=e.clientX;swiped=false;});
    stage.addEventListener('pointerup',e=>{
      if(x0==null)return;const dx=e.clientX-x0;x0=null;
      if(Math.abs(dx)>40){swiped=true;setCar(cat,sel[cat]+(dx<0?1:-1),true);setTimeout(()=>{swiped=false;},0);}
    });
    stage.addEventListener('pointercancel',()=>{x0=null;});
  });
  $$('.cat .round').forEach(b=>b.addEventListener('click',()=>{
    const cat=b.closest('.cat').dataset.cat;setCar(cat,sel[cat]+Number(b.dataset.dir),true);
  }));
  $('#create').addEventListener('click',createOutfit);
  $('#exists').addEventListener('click',e=>{
    if(e.target.closest('[data-show]')){const o=existing();if(o)reveal(o.id);}
  });
}

function updateCreate(){
  const btn=$('#create'),ex=existing();
  if(ex){
    btn.disabled=true;
    btn.innerHTML='<span style="display:inline-flex;align-items:center;gap:8px">'+CHECK+'Outfit already exists</span>';
    $('#exists').innerHTML='This combination is already in your bank'+(view==='custom'&&!favOnly?' (#'+(S.outfits.indexOf(ex)+1)+')':'')+'. <button type="button" class="linkbtn" data-show>Show it</button>';
  }else{
    btn.disabled=false;btn.textContent='Create outfit';
    $('#exists').textContent='';
  }
}

function createOutfit(){
  if(existing())return;
  const c=current(),o={id:uid(),outer:c.outer,top:c.top,bottom:c.bottom};
  S.outfits.push(o);persist();
  renderBank();updateCreate();
  const card=$('.ocard[data-id="'+o.id+'"]');
  if(card){card.classList.add('fresh');setTimeout(()=>card.classList.remove('fresh'),1700);}
  toast('Outfit #'+S.outfits.length+' added to your bank',{label:'View',fn:()=>reveal(o.id)});
  announce('Outfit added to the outfit bank.');
}

function reveal(id){
  let card=$('.ocard[data-id="'+id+'"]');
  if(!card&&favOnly){favOnly=false;persist();renderBank();card=$('.ocard[data-id="'+id+'"]');}
  if(!card)return;
  card.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'center'});
  card.classList.remove('fresh');void card.offsetWidth;card.classList.add('fresh');
  setTimeout(()=>card.classList.remove('fresh'),1700);
}

/* ---------- outfit bank ---------- */
const bank=$('#bank');
const GRIP='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.8"/><circle cx="15" cy="6" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="18" r="1.8"/><circle cx="15" cy="18" r="1.8"/></svg>';
const STAR='<svg width="18" height="18" viewBox="0 0 24 24" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1L3.2 9.6l6.1-.8z"/></svg>';
const XICON='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function cardHTML(o,i,n,grouped){
  const top=find('top',o.top),bot=find('bottom',o.bottom),out=outerOf(o);
  const desc=(out?out.name+', ':'')+top.name+', '+bot.name;
  return '<li class="ocard '+(out?'wide':'slim')+'" data-id="'+o.id+'">'
    +'<div class="art photo">'+(out?imgTag(out,'i-outer'):'')+imgTag(top,'i-top')+imgTag(bot,'i-bottom')+'<button type="button" class="star" data-act="fav" aria-pressed="'+(o.fav?'true':'false')+'" aria-label="Favourite: '+esc(desc)+'">'+STAR+'</button></div>'
    +(grouped?'':'<span class="num" aria-hidden="true">'+(i+1)+'</span>')
    +'<button type="button" class="rm" data-act="rm" aria-label="Remove outfit: '+esc(desc)+'">'+XICON+'</button>'
    +(grouped?'</li>':'<div class="bar" role="group" aria-label="Outfit '+(i+1)+': '+esc(desc)+'">'
    +'<button type="button" data-act="earlier" aria-label="Move outfit '+(i+1)+' earlier"'+(i===0?' disabled':'')+'>'+CHEV.l+'</button>'
    +'<button type="button" data-grip aria-label="Drag to reorder outfit '+(i+1)+', or press arrow keys">'+GRIP+'</button>'
    +'<button type="button" data-act="later" aria-label="Move outfit '+(i+1)+' later"'+(i===n-1?' disabled':'')+'>'+CHEV.r+'</button>'
    +'</div></li>');
}
const byName=(cat,id)=>find(cat,id).name;
function sorted(primary){
  const other=primary==='top'?'bottom':'top';
  return vis().slice().sort((a,b)=>
    byName(primary,a[primary]).localeCompare(byName(primary,b[primary]))
    ||byName(other,a[other]).localeCompare(byName(other,b[other]))
    ||(Number(!!b.outer)-Number(!!a.outer))   /* with outerwear first */
    ||((a.outer?find('outer',a.outer).name:'').localeCompare(b.outer?find('outer',b.outer).name:'')));
}
function renderBank(){
  const list=vis(),n=list.length,total=S.outfits.length,favCount=S.outfits.filter(o=>o.fav).length;
  const grouped=view!=='custom';
  bank.hidden=grouped;$('#groups').hidden=!grouped;
  if(!grouped){
    bank.innerHTML=list.map((o,i)=>cardHTML(o,i,n)).join('');
    $('#groups').innerHTML='';
  }else{
    bank.innerHTML='';
    const groups=[];
    sorted(view).forEach(o=>{
      let g=groups[groups.length-1];
      if(!g||g.id!==o[view]){g={id:o[view],list:[]};groups.push(g);}
      g.list.push(o);
    });
    $('#groups').innerHTML=groups.map(g=>{
      const it=find(view,g.id);
      return '<section class="grp" aria-label="'+esc(it.name)+'"><h3 class="gh"><span class="gt photo">'+imgTag(it)+'</span>'+esc(it.name)
        +'<span class="gc">'+g.list.length+(g.list.length===1?' outfit':' outfits')+'</span></h3>'
        +'<ol class="bank">'+g.list.map(o=>cardHTML(o,0,n,true)).join('')+'</ol></section>';
    }).join('');
  }
  $('#count').textContent=favOnly?n+' of '+total+' outfits · favourites':total+(total===1?' outfit':' outfits');
  $('#empty').hidden=n>0;
  $('#empty').textContent=total===0?'No outfits yet. Choose a top and a bottom, then press Create outfit.':'No favourites yet. Tap the star on an outfit to add it here.';
  const ff=$('#favFilter');ff.setAttribute('aria-pressed',favOnly?'true':'false');ff.textContent='★ Favourites ('+favCount+')';
  $('#hint').hidden=n<(grouped?1:2);
  $('#hint').textContent=grouped
    ?'Sorted automatically: '+view+' A–Z, then '+(view==='top'?'bottom':'top')+' A–Z, then outfits with outerwear first. Switch to Custom order to rearrange.'
    :'Drag the grip, or use the arrows, to change the order.';
  $$('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view?'true':'false'));
  if(calBuilt)paintCal();
}
const snap=()=>new Map($$('.ocard').map(el=>[el.dataset.id,el.getBoundingClientRect()]));
function flip(before){
  if(reduced())return;
  $$('.ocard').forEach(el=>{
    const b=before.get(el.dataset.id);if(!b)return;
    const a=el.getBoundingClientRect(),dx=b.left-a.left,dy=b.top-a.top;
    if(dx||dy)el.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:220,easing:'cubic-bezier(.3,.7,.2,1)'});
  });
}

function move(id,d,focus){
  const v=vis(),vi=v.findIndex(o=>o.id===id),vj=vi+d;
  if(vi<0||vj<0||vj>=v.length)return;
  const before=snap();
  const x=v[vi],y=v[vj];   /* copy first: v is S.outfits itself when no filter is on */
  const a=S.outfits.indexOf(x),b2=S.outfits.indexOf(y);
  S.outfits[a]=y;S.outfits[b2]=x;
  const j=vj;
  persist();renderBank();flip(before);updateCreate();
  const card=$('.ocard[data-id="'+id+'"]');
  let t=card.querySelector(focus==='grip'?'[data-grip]':'[data-act="'+focus+'"]');
  if(!t||t.disabled)t=card.querySelector('[data-grip]');
  t.focus({preventScroll:true});
  announce('Outfit moved to position '+(j+1)+' of '+v.length+'.');
}

let removed=null;
function removeOutfit(id){
  const i=S.outfits.findIndex(o=>o.id===id);if(i<0)return;
  const before=snap();
  const [o]=S.outfits.splice(i,1);removed={o,i};
  persist();renderBank();flip(before);updateCreate();
  toast('Outfit removed',{label:'Undo',fn:()=>{
    if(!removed)return;const b=snap();
    S.outfits.splice(Math.min(removed.i,S.outfits.length),0,removed.o);removed=null;
    persist();renderBank();flip(b);updateCreate();announce('Outfit restored.');
  }});
  announce('Outfit removed.');
}

$('#favFilter').addEventListener('click',()=>{
  favOnly=!favOnly;persist();renderBank();updateCreate();
  announce(favOnly?'Showing favourites only.':'Showing all outfits.');
});
$('.seg').addEventListener('click',e=>{
  const b=e.target.closest('[data-view]');if(!b||b.dataset.view===view)return;
  view=b.dataset.view;persist();renderBank();updateCreate();
  announce(view==='custom'?'Custom order.':'Grouped by '+view+'.');
});
$('#bankarea').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.closest('.ocard').dataset.id,a=b.dataset.act;
  if(a==='fav'){
    const o=S.outfits.find(x=>x.id===id);if(!o)return;
    const before=snap();o.fav=!o.fav;persist();renderBank();flip(before);
    const nb=$('.ocard[data-id="'+id+'"] [data-act="fav"]');if(nb)nb.focus({preventScroll:true});
    announce(o.fav?'Added to favourites.':'Removed from favourites.');return;
  }
  if(a==='rm')removeOutfit(id);else move(id,a==='earlier'?-1:1,a);
});
bank.addEventListener('keydown',e=>{
  const g=e.target.closest('[data-grip]');if(!g)return;
  const id=g.closest('.ocard').dataset.id;
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();move(id,-1,'grip');}
  else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();move(id,1,'grip');}
});

/* drag to reorder (mouse, touch, pen) */
let drag=null;
bank.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-grip]');
  if(!g||drag||(e.pointerType==='mouse'&&e.button!==0))return;
  e.preventDefault();
  const card=g.closest('.ocard'),r=card.getBoundingClientRect();
  const clone=card.cloneNode(true);
  clone.classList.add('drag-clone');clone.removeAttribute('data-id');
  clone.style.left=r.left+'px';clone.style.top=r.top+'px';
  document.body.appendChild(clone);
  card.classList.add('is-dragging');document.body.classList.add('dragging');
  drag={g,card,clone,pid:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top,x:e.clientX,y:e.clientY,orig:vis().map(o=>o.id),raf:0};
  window.addEventListener('pointermove',onDragMove);
  window.addEventListener('pointerup',onDragEnd);
  window.addEventListener('pointercancel',onDragCancel);
  window.addEventListener('keydown',onDragKey,true);
  drag.raf=requestAnimationFrame(dragTick);
});
function place(){
  const d=drag;if(!d)return;
  d.clone.style.left=(d.x-d.dx)+'px';d.clone.style.top=(d.y-d.dy)+'px';
  const t=document.elementsFromPoint(d.x,d.y).map(el=>el.closest&&el.closest('.ocard')).find(c=>c&&c!==d.card&&c.parentNode===bank);
  if(!t)return;
  const r=t.getBoundingClientRect(),after=d.x>r.left+r.width/2;
  const ref=after?t.nextSibling:t;
  if(ref===d.card||ref===d.card.nextSibling)return;
  const before=snap();bank.insertBefore(d.card,ref);flip(before);
}
function onDragMove(e){if(!drag||e.pointerId!==drag.pid)return;drag.x=e.clientX;drag.y=e.clientY;place();}
function dragTick(){
  const d=drag;if(!d)return;
  const v=window.innerHeight;let s=0;
  if(d.y<70)s=-12;else if(d.y>v-70)s=12;
  if(s){window.scrollBy(0,s);place();}
  d.raf=requestAnimationFrame(dragTick);
}
function endDrag(){
  const d=drag;if(!d)return;drag=null;
  cancelAnimationFrame(d.raf);
  window.removeEventListener('pointermove',onDragMove);window.removeEventListener('pointerup',onDragEnd);window.removeEventListener('pointercancel',onDragCancel);
  window.removeEventListener('keydown',onDragKey,true);
  d.clone.remove();d.card.classList.remove('is-dragging');document.body.classList.remove('dragging');
  return d;
}
function onDragEnd(){
  const d=endDrag();if(!d)return;
  const order=Array.from(bank.children).map(c=>c.dataset.id);
  const byId=new Map(S.outfits.map(o=>[o.id,o]));
  const slots=[];S.outfits.forEach((o,k)=>{if(order.includes(o.id))slots.push(k);});
  if(slots.length===order.length&&new Set(order).size===order.length&&order.every(id=>byId.has(id)))
    order.forEach((id,k)=>{S.outfits[slots[k]]=byId.get(id);});
  persist();renderBank();updateCreate();
  const i=order.indexOf(d.card.dataset.id);
  if(order.join()!==d.orig.join())announce('Outfit moved to position '+(i+1)+' of '+order.length+'.');
}
function onDragCancel(){
  const d=endDrag();if(!d)return;
  renderBank();
}
function onDragKey(e){if(e.key==='Escape'){e.preventDefault();onDragCancel();}}

/* ---------- calendar ---------- */
let calBuilt=false,calCur=0,calFav=false,swipedC=false;
const outfitFor=i=>{const id=P[DAYS[i].date];return S.outfits.find(o=>o.id===id)||null;};
const usedDays=id=>DAYS.map((d,i)=>P[d.date]===id?d.n:0).filter(Boolean);
function miniArt(o){
  const top=find('top',o.top),bot=find('bottom',o.bottom),out=outerOf(o);
  return '<div class="ocard '+(out?'wide':'slim')+'"><div class="art photo">'+(out?imgTag(out,'i-outer'):'')+imgTag(top,'i-top')+imgTag(bot,'i-bottom')+'</div></div>';
}
function slotHTML(i){
  const o=outfitFor(i);
  return o?miniArt(o):'<div class="ocard slim"><div class="art photo noout"><span><b>+</b>No outfit<br>chosen</span></div></div>';
}
function buildCal(){
  const st=$('#cstage');
  st.innerHTML=DAYS.map((d,i)=>'<div class="cslot" data-i="'+i+'" data-pos="2"></div>').join('');
  $('#cprev').innerHTML=CHEV.l;$('#cnext').innerHTML=CHEV.r;
  $('#daystrip').innerHTML=DAYS.map((d,i)=>'<button type="button" class="chip" data-i="'+i+'"><small>Day</small>'+d.n+'<i></i></button>').join('');
  const today=new Date(),ds=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const ti=DAYS.findIndex(d=>d.date===ds);calCur=ti>=0?ti:0;
  st.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){e.preventDefault();calGo(calCur-1,true);}
    else if(e.key==='ArrowRight'){e.preventDefault();calGo(calCur+1,true);}
  });
  st.addEventListener('click',e=>{
    if(swipedC){swipedC=false;return;}
    const s=e.target.closest('.cslot');if(!s)return;
    const p=Number(s.dataset.pos);if(p===-1)calGo(calCur-1,true);else if(p===1)calGo(calCur+1,true);
  });
  let x0=null;
  st.addEventListener('pointerdown',e=>{x0=e.clientX;swipedC=false;});
  st.addEventListener('pointerup',e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;
    if(Math.abs(dx)>40){swipedC=true;calGo(calCur+(dx<0?1:-1),true);setTimeout(()=>{swipedC=false;},0);}});
  st.addEventListener('pointercancel',()=>{x0=null;});
  $('#cprev').addEventListener('click',()=>calGo(calCur-1,true));
  $('#cnext').addEventListener('click',()=>calGo(calCur+1,true));
  $('#daystrip').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)calGo(Number(c.dataset.i),true);});
  $('#pickFav').addEventListener('click',()=>{calFav=!calFav;paintPicker();});
  $('#pickClear').addEventListener('click',()=>{delete P[DAYS[calCur].date];persist();paintCal();announce('Day '+DAYS[calCur].n+' cleared.');});
  $('#pickstrip').addEventListener('click',e=>{
    if(e.target.closest('[data-goto]')){showTab('builder');return;}
    const b=e.target.closest('.pick');if(!b)return;
    const d=DAYS[calCur],id=b.dataset.id;
    if(P[d.date]===id)delete P[d.date];else P[d.date]=id;
    persist();paintCal();
    announce(P[d.date]?'Outfit chosen for day '+d.n+'.':'Day '+d.n+' cleared.');
  });
  calBuilt=true;
  Array.from(st.children).forEach(el=>{el.dataset.pos=Math.max(-2,Math.min(2,Number(el.dataset.i)-calCur));});
  paintCal();
  requestAnimationFrame(()=>requestAnimationFrame(()=>st.classList.remove('init')));
}
function paintPicker(){
  const d=DAYS[calCur],cur=P[d.date];
  $('#pickTitle').textContent='Outfit for Day '+d.n+' · '+d.label;
  $('#pickClear').disabled=!cur;
  $('#pickFav').setAttribute('aria-pressed',calFav?'true':'false');
  /* Assigned outfits first, in order of the first day they are worn; the rest keep bank order. */
  const firstDay=o=>{const k=DAYS.findIndex(x=>P[x.date]===o.id);return k<0?Infinity:k;};
  const list=S.outfits.map((o,k)=>({o,k,f:firstDay(o)})).filter(x=>!calFav||x.o.fav)
    .sort((a,b)=>(a.f===b.f?a.k-b.k:a.f-b.f)).map(x=>x.o);
  const strip=$('#pickstrip'),keep=strip.scrollLeft;
  const before=new Map($$('#pickstrip .pick').map(el=>[el.dataset.id,el.getBoundingClientRect()]));
  if(!S.outfits.length)strip.innerHTML='<div class="pickempty">Your outfit bank is empty. <button type="button" class="linkbtn" data-goto>Create outfits on the Capsule Builder tab</button></div>';
  else if(!list.length)strip.innerHTML='<div class="pickempty">No favourites yet. Star an outfit in the bank first.</div>';
  else strip.innerHTML=list.map(o=>{
    const u=usedDays(o.id);
    const nm=[o.outer?find('outer',o.outer).name:null,find('top',o.top).name,find('bottom',o.bottom).name].filter(Boolean).join(', ');
    return '<button type="button" class="pick" data-id="'+o.id+'" aria-pressed="'+(cur===o.id)+'" aria-label="'+esc(nm)+'">'+miniArt(o)+'<span class="tick">'+CHECK+'</span>'
      +(o.fav?'<span class="pstar" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1L3.2 9.6l6.1-.8z"/></svg></span>':'')
      +'<span class="used">'+(u.length?'Day '+u.slice(0,3).join(', ')+(u.length>3?'…':''):'')+'</span></button>';
  }).join('');
  strip.scrollLeft=keep;
  if(!reduced())$$('#pickstrip .pick').forEach(el=>{
    const b=before.get(el.dataset.id);if(!b)return;
    const dx=b.left-el.getBoundingClientRect().left;
    if(dx)el.animate([{transform:'translateX('+dx+'px)'},{transform:'none'}],{duration:240,easing:'cubic-bezier(.3,.7,.2,1)'});
  });
}
function paintCal(){
  const st=$('#cstage');
  Array.from(st.children).forEach((el,i)=>{el.innerHTML=slotHTML(i);});
  const d=DAYS[calCur];
  $('#dayinfo').innerHTML='<div class="dn">Day '+d.n+'</div><div class="dd">'+esc(d.label)+'</div><div class="dnote">'+esc(d.note)+'</div>'+(d.leaves?'<div class="dleaf" aria-label="Autumn colour '+Array.from(d.leaves).length+' of 3">'+d.leaves+'</div>':'<div class="dleaf" aria-hidden="true">&nbsp;</div>');
  $$('#daystrip .chip').forEach((c,i)=>{
    c.classList.toggle('has',!!outfitFor(i));
    if(i===calCur)c.setAttribute('aria-current','true');else c.removeAttribute('aria-current');
    c.setAttribute('aria-label','Day '+DAYS[i].n+', '+DAYS[i].label+(outfitFor(i)?', outfit chosen':', no outfit'));
  });
  $('#cprev').disabled=calCur===0;$('#cnext').disabled=calCur===DAYS.length-1;
  $('#cprev').setAttribute('aria-label','Previous day'+(calCur>0?': Day '+DAYS[calCur-1].n:''));
  $('#cnext').setAttribute('aria-label','Next day'+(calCur<DAYS.length-1?': Day '+DAYS[calCur+1].n:''));
  paintPicker();
}
function calGo(i,animate){
  i=Math.max(0,Math.min(DAYS.length-1,i));if(i===calCur)return;
  calCur=i;
  Array.from($('#cstage').children).forEach((el,k)=>{
    const pos=Math.max(-2,Math.min(2,k-calCur));
    el.dataset.pos=pos;
    if(Math.abs(pos)>1)el.setAttribute('aria-hidden','true');else el.removeAttribute('aria-hidden');
  });
  paintCal();
  const c=$('#daystrip .chip[aria-current]');
  if(c){const s=$('#daystrip');s.scrollTo({left:c.offsetLeft-s.clientWidth/2+c.offsetWidth/2,behavior:reduced()?'auto':'smooth'});}
  if(animate)announce('Day '+DAYS[calCur].n+', '+DAYS[calCur].label+'.');
}

/* ---------- tabs ---------- */
function showTab(name){
  const cal=name==='calendar';
  $('#page-builder').hidden=cal;$('#page-cal').hidden=!cal;
  $$('.tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===name?'true':'false'));
  try{const h=cal?'calendar':'builder';if(location.hash!=='#'+h)location.hash=h;}catch(e){}
  if(cal){if(!calBuilt)buildCal();else paintCal();}
}
$('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab);});

/* ---------- copy all / paste all ---------- */
function copyText(text,okMsg){
  const fallback=()=>{
    $('#fallback').hidden=false;
    const ta=$('#fbta');ta.value=text;ta.focus();ta.select();
    toast('Select and copy the text below.');
  };
  try{navigator.clipboard.writeText(text).then(()=>toast(okMsg),fallback);}catch(e){fallback();}
}
let armTimer=0;
function disarm(){clearTimeout(armTimer);const b=$('#pasteApply');b.classList.remove('warn');b.textContent='Replace everything';b.dataset.armed='';}
$('#copyAll').addEventListener('click',()=>{
  if(!S.outfits.length){toast('Nothing to copy yet.');return;}
  copyText(JSON.stringify({app:'capsule-builder',version:2,outfits:S.outfits,plan:P}),'Copied '+S.outfits.length+(S.outfits.length===1?' outfit':' outfits')+'. Use Paste all on another device.');
});
$('#fbClose').addEventListener('click',()=>{$('#fallback').hidden=true;});
$('#pasteOpen').addEventListener('click',()=>{$('#pastebox').hidden=false;$('#pta').focus();});
$('#pasteCancel').addEventListener('click',()=>{disarm();$('#pastebox').hidden=true;$('#pta').value='';});
$('#pasteApply').addEventListener('click',()=>{
  const raw=$('#pta').value;let data=null;
  try{const i=raw.indexOf('{'),j=raw.lastIndexOf('}');if(i>=0&&j>i)data=JSON.parse(raw.slice(i,j+1));}catch(e){data=null;}
  if(!data||data.app!=='capsule-builder'||!Array.isArray(data.outfits)){toast('That text is not from Copy all. Nothing changed.');return;}
  const clean=cleanOutfits(data.outfits),skipped=data.outfits.length-clean.length;
  if(data.outfits.length&&!clean.length){toast('None of those outfits match items on this page. Nothing changed.');return;}
  const btn=$('#pasteApply');
  if(S.outfits.length&&btn.dataset.armed!=='1'){
    btn.dataset.armed='1';btn.classList.add('warn');btn.textContent='Confirm: replace everything';
    clearTimeout(armTimer);armTimer=setTimeout(disarm,5000);return;
  }
  disarm();
  S.outfits=clean;removed=null;
  const ids=new Set(clean.map(o=>o.id)),src=data.plan&&typeof data.plan==='object'?data.plan:P,np={};
  Object.keys(src).forEach(k=>{if(ids.has(src[k])&&DAYS.some(d=>d.date===k))np[k]=src[k];});
  P=np;persist();renderBank();updateCreate();
  $('#pastebox').hidden=true;$('#pta').value='';
  toast('Loaded '+clean.length+(clean.length===1?' outfit':' outfits')+(Object.keys(P).length?' and '+Object.keys(P).length+(Object.keys(P).length===1?' calendar day':' calendar days'):'')+(skipped?' ('+skipped+' skipped: not matching this page)':'')+'.');
  announce('Bank replaced with pasted outfits.');
});

/* ---------- toast ---------- */
let tt=0;
function toast(msg,action){
  const el=$('#toast');
  el.innerHTML='<span>'+esc(msg)+'</span>'+(action?'<button type="button">'+esc(action.label)+'</button>':'');
  const hide=()=>{el.classList.remove('show');};
  if(action)el.querySelector('button').addEventListener('click',()=>{action.fn();hide();});
  el.classList.add('show');clearTimeout(tt);tt=setTimeout(hide,5500);
}

/* ---------- start ---------- */
buildBuilder();wireBuilder();renderBank();updateCreate();
if(location.hash==='#calendar')showTab('calendar');
/* Offline support: only where the page is served over http(s), e.g. GitHub Pages. */
try{
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{
      let seen=false;try{seen=localStorage.getItem('capsule-offline-ready')==='1';}catch(e){}
      if(!seen){try{localStorage.setItem('capsule-offline-ready','1');}catch(e){}toast('Saved for offline use. You can add it to your home screen.');}
    }).catch(()=>{});
  }
}catch(e){}
window.addEventListener('hashchange',()=>{showTab(location.hash==='#calendar'?'calendar':'builder');});
})();
</script>
